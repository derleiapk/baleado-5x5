<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Baleado 5×5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>
/* Layout: full-bleed arena canvas; HUD + inner-voice strip on top, thumb controls at the bottom. Single dark look by design. */
:root{
  --ink:#090d1a; --ink2:#121831; --line:#2a3358;
  --paper:#f2f4ff; --muted:#8d94ba;
  --court:#1c8783; --red:#ff3b4e; --gold:#f2c14e;
  --spy:#5aa9ff; --rose:#ff4d6d; --ok:#4fe3a1;
  --display:'Dela Gothic One','Arial Black',Impact,sans-serif;
  --body:'Zen Kaku Gothic New',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--paper);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

#topzone{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:grid;gap:6px;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.rnd{display:grid;line-height:1.05}
.rnd b{font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.06em;color:var(--red)}
.rnd span{font-size:11px;color:var(--muted);font-weight:700}
.score{display:flex;justify-content:center;align-items:center;gap:8px;min-width:0}
.dots{display:flex;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid currentColor}
.dot.on{background:currentColor}
.dot.big{width:12px;height:12px}
.vs{font-family:var(--display);font-size:12px;color:var(--muted)}
.en{display:grid;justify-items:end;gap:3px}
.en small{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:900}
.enbar{width:84px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.enbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--spy),var(--rose));transition:width .15s}

#thought{min-height:50px;display:grid;align-content:center;gap:1px;padding:7px 12px;border-radius:12px;
  background:rgba(9,13,26,.78);border:1px dashed rgba(141,148,186,.45);border-left:3px solid var(--who,var(--muted));
  opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;max-width:560px;justify-self:center;width:100%;box-sizing:border-box}
#thought.on{opacity:1;transform:none}
#thought b{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--who,var(--muted));font-weight:900}
#thought span{font-size:14px;font-style:italic;line-height:1.3;color:var(--paper)}

#controls{position:fixed;left:0;right:0;bottom:0;z-index:6;height:226px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#joyzone{pointer-events:auto;position:relative;width:46%;height:100%;touch-action:none}
#joybase{position:absolute;left:10px;bottom:14px;width:112px;height:112px;border-radius:50%;
  border:2px solid rgba(242,244,255,.22);background:radial-gradient(circle,rgba(90,169,255,.1),rgba(9,13,26,.35));transition:opacity .2s}
#joyknob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(242,244,255,.85);box-shadow:0 0 0 4px rgba(90,169,255,.35)}
#btns{pointer-events:auto;display:grid;grid-template-columns:auto auto;grid-template-areas:"sw sp" "es th" "pu th";gap:9px;align-items:center;justify-items:center}
#bSwitch{grid-area:sw}#bSpecial{grid-area:sp}#bDodge{grid-area:es}#bThrow{grid-area:th}#bJump{grid-area:pu;border-color:var(--ok)}
.b{font-family:var(--display);font-weight:400;color:var(--paper);border-radius:50%;border:2px solid rgba(242,244,255,.3);
  background:rgba(18,24,49,.82);display:grid;place-content:center;text-align:center;line-height:1;touch-action:none;cursor:pointer;padding:0;letter-spacing:.02em}
.b small{display:block;font-family:var(--body);font-weight:900;font-size:10px;margin-top:3px;color:var(--muted)}
.b:focus-visible{outline:3px solid var(--spy);outline-offset:2px}
.b.down{transform:scale(.92)}
.b.off{opacity:.42}
.sm{width:60px;height:60px;font-size:9.5px}
.md{width:72px;height:72px;font-size:11px}
.lg{width:94px;height:94px;font-size:11px}
#bThrow{border-color:var(--red);background:radial-gradient(circle at 40% 35%,#ff5a6b,#b81d32)}
#bThrow.off{background:rgba(18,24,49,.82);border-color:rgba(242,244,255,.3)}
#bSpecial.ready{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,244,255,.08),0 0 18px rgba(242,193,78,.5)}
#bSwitch{border-color:var(--sw,var(--rose))}

#screen{position:fixed;inset:0;z-index:20;overflow-y:auto;touch-action:pan-y;
  background:linear-gradient(180deg,rgba(9,13,26,.72),rgba(9,13,26,.94) 55%);
  padding-top:calc(env(safe-area-inset-top,0px) + 28px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{max-width:560px;margin:0 auto;display:grid;gap:18px}
.kick{font-size:11px;letter-spacing:.2em;font-weight:900;color:var(--gold);text-transform:uppercase}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(46px,14vw,92px);line-height:.88;letter-spacing:-.01em;text-wrap:balance}
h1 em{display:block;font-style:normal;color:var(--red);transform:skewX(-8deg);transform-origin:left;text-shadow:4px 4px 0 rgba(255,59,78,.22)}
h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,52px);line-height:.95;text-wrap:balance}
.lead{margin:0;font-size:16px;line-height:1.55;max-width:62ch;color:#d9ddf3}
.spies{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.spies{grid-template-columns:1fr}}
.spy{border-radius:14px;padding:12px;background:var(--ink2);border:1px solid var(--line);border-top:3px solid var(--c);display:grid;gap:6px;min-width:0}
.spy b{font-family:var(--display);font-weight:400;font-size:20px}
.spy i{font-style:normal;font-size:10px;letter-spacing:.16em;font-weight:900;color:var(--c)}
.spy p{margin:0;font-size:13px;line-height:1.45;color:#c9cdea}
ul.intel{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.intel li{font-size:14px;line-height:1.45;padding-left:14px;position:relative;color:#d9ddf3}
ul.intel li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;background:var(--red);transform:rotate(45deg)}
.go{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.04em;color:#fff;background:var(--red);border:0;border-radius:12px;padding:16px 20px;cursor:pointer;justify-self:start;box-shadow:0 6px 0 #9a1426}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #9a1426}
.go:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.opt{display:flex;gap:10px;align-items:center;font-size:14px;color:#c9cdea}
.opt input{width:20px;height:20px;accent-color:var(--red)}
.keys{font-size:12px;line-height:1.6;color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px}
.stat b{font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
blockquote{margin:0;padding:10px 14px;border-left:3px solid var(--who,var(--spy));background:rgba(18,24,49,.7);border-radius:0 10px 10px 0;font-style:italic;font-size:15px;line-height:1.45}
blockquote cite{display:block;font-style:normal;font-size:10px;letter-spacing:.16em;font-weight:900;color:var(--who,var(--spy));margin-top:4px;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){#thought,.enbar i{transition:none}}
</style>

<canvas id="cv"></canvas>

<div id="topzone">
  <div id="hud">
    <div class="rnd"><b id="rndN">RODADA 1</b><span id="rndT">Os Herdeiros</span></div>
    <div class="score"><div class="dots" id="dotsA"></div><span class="vs">×</span><div class="dots" id="dotsB"></div></div>
    <div class="en"><small>FOCO</small><div class="enbar"><i id="enfill"></i></div></div>
  </div>
  <div id="thought"><b id="thWho"></b><span id="thTxt"></span></div>
</div>

<div id="controls">
  <div id="joyzone"><div id="joybase"><div id="joyknob"></div></div></div>
  <div id="btns">
    <button id="bSwitch" class="b sm" type="button">TROCAR<small id="swName">Lívia</small></button>
    <button id="bSpecial" class="b sm" type="button"><span id="spName">ANÁLISE</span><small id="spCost">50</small></button>
    <button id="bDodge" class="b md" type="button">ESQUIVA</button>
    <button id="bJump" class="b md" type="button">PULO</button>
    <button id="bThrow" class="b lg" type="button">ARREMES-<br>SAR</button>
  </div>
</div>

<div id="screen"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const INK='#090d1a', G=9.8, HALF=4.65, ZC=9, H0=15;

/* ---------- layout & projection ---------- */
let W=0,H=0,DPR=1,F=300,CX=0,HY=0;
const cam={x:0,h:H0,zoom:1,fx:0,fy:0,tx:0,tz:1,shake:0,ox:0,oy:0};
function resize(){
  DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const top=$('#topzone').getBoundingClientRect().bottom+6;
  const bot=$('#controls').getBoundingClientRect().top+40;
  const spanK=H0/ZC-(H0-6)/(ZC+23);
  F=Math.max(120,Math.min(.95*W*ZC/10,(bot-top)/spanK));
  CX=W/2;const extra=Math.max(0,(bot-top)-spanK*F);HY=bot-extra*.5-(H0/ZC)*F;cam.fx=CX;cam.fy=HY+F*1.1;
}
addEventListener('resize',resize);
function P(x,y,z){
  const D=Math.max(.6,z+ZC),s=F/D;
  let sx=CX+(x-cam.x)*s+cam.x*F/(ZC+10),sy=HY+(cam.h-y)*s;
  sx=cam.fx+(sx-cam.fx)*cam.zoom;sy=cam.fy+(sy-cam.fy)*cam.zoom;
  return{x:sx+cam.ox,y:sy+cam.oy,s:s*cam.zoom};
}

/* ---------- audio & voice ---------- */
let AC=null,NB=null;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate;NB=AC.createBuffer(1,n,n);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function osc(type,f0,f1,dur,vol){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05)}
function noise(dur,vol,f0,f1){const t=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.4;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.05)}
function sfx(k){if(!AC)return;try{
  if(k==='throw')noise(.2,.35,700,2600);
  else if(k==='fury'){noise(.5,.5,300,4000);osc('sawtooth',90,40,.5,.15)}
  else if(k==='hit'){osc('sine',160,40,.35,.6);noise(.12,.4,2000,400)}
  else if(k==='dash')noise(.14,.22,2400,900);
  else if(k==='catch'){osc('triangle',600,1200,.12,.25)}
  else if(k==='block'){osc('square',900,500,.1,.12);noise(.08,.3,3000,2000)}
  else if(k==='scan'){osc('sine',300,1400,.6,.15)}
  else if(k==='slow'){osc('sine',220,70,.9,.25)}
  else if(k==='shot'){noise(.1,.5,4000,800);osc('square',140,60,.15,.15)}
  else if(k==='go'){osc('square',440,880,.25,.15)}
}catch(e){}}
let VOX=[],lastSay=0;
function loadVoices(){try{VOX=speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang))}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function say(text,pitch){
  if(!S.voice||!('speechSynthesis' in window))return;
  const now=performance.now();if(now-lastSay<420)return;lastSay=now;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[!.…]/g,''));u.lang='pt-BR';
    const v=VOX.find(v=>/BR/i.test(v.lang))||VOX[0];if(v)u.voice=v;u.rate=1.3;u.pitch=pitch;speechSynthesis.speak(u)}catch(e){}
}

/* ---------- characters ---------- */
function mkC(o){return Object.assign({x:0,z:0,mx:0,mz:0,avx:0,avz:0,alive:true,deadT:0,hold:-1,dashT:-1,dashCD:0,ddx:0,ddz:0,
  wind:0,windTarget:null,throwAnim:0,an:0,mv:false,face:1,ghosts:[],perfect:false,known:new Set(),
  ai:{tx:0,tz:0,t:0},speed:3.7,throwSpd:11,err:1.2,dodge:.2,windR:[1,1.5],glove:0,boots:false,vest:0,rich:false,spy:false,male:true,
  hair:'#3b2a20',hairStyle:'short',shirt:'#d9dde8',collar:'#5c6b8a',skin:'#eec3a0',color:'#f2f4ff',pitch:1},o)}
const SPY_A=()=>mkC({id:'adrian',name:'Adrian',code:'CORVO',team:'A',spy:true,male:true,speed:5.4,throwSpd:17,err:.25,dodge:.7,windR:[.6,.9],hair:'#1d2547',hairStyle:'spike',shirt:'#eef1fb',collar:'#2c4f9e',skin:'#f1c9a8',color:'#5aa9ff',pitch:.7});
const SPY_L=()=>mkC({id:'livia',name:'Lívia',code:'VESPA',team:'A',spy:true,male:false,speed:5.8,throwSpd:19,err:.25,dodge:.75,windR:[.5,.8],hair:'#c71f42',hairStyle:'bob',shirt:'#eef1fb',collar:'#9e2c4a',skin:'#f6d3b8',color:'#ff4d6d',pitch:1.35});
const CIV_POOL=[['Tomás','o padeiro',true],['Inês','a enfermeira',false],['Caio','o estudante',true],['Rosa','a costureira',false],['Bento','o taxista',true],['Lúcia','a professora',false],['Davi','o entregador',true],['Marta','a feirante',false],['Ivo','o zelador',true]];
const HAIRS=['#3b2a20','#16161c','#6b4a2f','#8a8f99','#a0522d'];
function allyCiv(d){return mkC({id:'c_'+d[0],name:d[0],desc:d[1],male:d[2],team:'A',dodge:.38,hair:d.hair||(d.hair=pick(HAIRS)),hairStyle:d[2]?'short':'pony',shirt:'#dfe3ee',collar:'#5c6b8a',skin:pick(['#eec3a0','#c99672','#8d5a3b','#f3d2b5'])})}
const enemyCiv=(name,male)=>mkC({name,male,team:'B',speed:3.6,throwSpd:11,err:1.5,dodge:.15,windR:[1.4,2],hair:pick(HAIRS),hairStyle:male?'short':'pony',shirt:'#8f95aa',collar:'#555b70',skin:pick(['#eec3a0','#c99672','#8d5a3b'])});
const rich=(o)=>mkC(Object.assign({team:'B',rich:true,speed:4.3,throwSpd:14,err:1,dodge:.35,windR:[.9,1.4],shirt:'#16182a',collar:'#f2c14e'},o));

const HITS=6;
const ROUNDS=[
 {n:'RODADA 1',t:'Os Herdeiros',turret:0,
  intro:'Primeira rodada. Do outro lado, dois herdeiros de famílias poderosas e três civis trazidos à força. Do nosso, três civis que nunca jogaram nada parecido.',
  intel:['Os de preto e dourado compraram equipamento na loja preparatória.','Acertos do nosso time nocauteiam: a equipe médica infiltrada retira os civis adversários.','Esquivar no momento exato rende Foco. Foco alimenta os especiais.'],
  enemies:()=>[rich({name:'Beatriz Valmont',male:false,glove:.45,hair:'#e8c35a',hairStyle:'curls',skin:'#f6d6bd'}),rich({name:'Otávio Prado',glove:.4,hair:'#4a3020',hairStyle:'slick'}),enemyCiv('Rui',true),enemyCiv('Dora',false),enemyCiv('Neto',true)],
  script:[[0,'adrian','Cinco contra cinco. Cada jogador aguenta 6 boladas. Na sexta, não levanta mais.'],[4.5,'livia','Os de dourado compraram luvas na loja preparatória. Os outros três são civis como os nossos.'],[9,'adrian','Mirar nos ombros, nocautear, nunca matar. Vamos tirar todo mundo daqui.']]},
 {n:'RODADA 2',t:'Camarote',turret:6.5,
  intro:'A plateia está mais cheia. Alguém pagou por uma vantagem que não está dentro da quadra.',
  intel:['Celeste e Victor estão rápidos demais.','Repare no camarote atrás do time adversário.','ANÁLISE (Adrian) revela trapaças. Depois disso, o próximo arremesso dele neutraliza o atirador.'],
  enemies:()=>[rich({name:'Celeste Arantes',male:false,glove:.5,boots:true,hair:'#f0e6d8',hairStyle:'pony'}),rich({name:'Victor Lemos',boots:true,hair:'#2a1a12',hairStyle:'slick'}),rich({name:'Duda Sarmento',male:false,glove:.45,hair:'#7a2e1d',hairStyle:'curls'}),enemyCiv('Lia',false),enemyCiv('Jonas',true)],
  script:[[0,'adrian','O camarote está fechado demais. Tem alguém lá em cima.'],[4.5,'livia','A Celeste está mais rápida que ontem. Tênis com mola?'],[9,'adrian','Vou juntar Foco e usar a análise para confirmar.']]},
 {n:'FINAL',t:'Miles Hartwell',turret:5,
  intro:'A final. Miles Hartwell, herdeiro do dono do torneio, treinou com os melhores desde criança. O colar está no camarote do pai dele.',
  intel:['Miles lança rápido e quase nunca erra.','Ele pode ter mais de uma proteção.','FÚRIA (Lívia) atravessa luvas e coletes.'],
  enemies:()=>[rich({name:'Miles Hartwell',boss:true,glove:.55,boots:true,vest:1,speed:4.8,throwSpd:21,err:.3,dodge:.7,windR:[.45,.7],hair:'#e9edf5',hairStyle:'plat',shirt:'#f4f1e6',collar:'#f2c14e'}),rich({name:'Sabine Roux',male:false,glove:.5,hair:'#111',hairStyle:'bob'}),rich({name:'Fausto Brandão',boots:true,hair:'#5a3a22',hairStyle:'slick'}),enemyCiv('Mila',false),enemyCiv('Beto',true)],
  script:[[0,'adrian','Esse é o Miles. O pai dele é dono de tudo isso. Ele treina com os maiores desde criança.'],[5,'livia','Então ele nunca precisou desviar de verdade.'],[9.5,'adrian','Vença, e a gente entra no camarote do pai. É lá que o esquema termina.']]},
];

/* ---------- state ---------- */
const S={mode:'title',round:0,chars:[],balls:[],ctrl:0,energy:40,time:0,analysis:0,furyT:0,hitstop:0,endT:0,
  shouts:[],fx:[],tq:[],th:null,flags:{},turret:null,rec:[],rp:null,pendingReplay:null,lastReplay:-99,script:[],
  voice:true,allyPool:CIV_POOL.slice(),allies:[],roundStartAllies:[],stats:{},total:{saved:0,rescued:0,lost:0},introT:0};
const me=()=>S.chars[S.ctrl];

function startRound(i,retry){
  S.round=i;const R=ROUNDS[i];
  if(!retry){
    if(i===0){S.allyPool=CIV_POOL.slice().sort(()=>Math.random()-.5);S.allies=S.allyPool.splice(0,3);S.total={saved:0,rescued:0,lost:0}}
    S.replaced=[];while(S.allies.length<3){const d=S.allyPool.shift();S.allies.push(d);S.replaced.push(d[0])}
    S.roundStartAllies=S.allies.slice();
  }else S.allies=S.roundStartAllies.slice();
  const A=[SPY_A(),SPY_L(),...S.allies.map(allyCiv)];

  if(S.mode==='play'&&m)tx=clamp(m.x*.12,-.6,.6);
  if(S.analysis>0)tz=1.04;
  if(S.furyT>0){const fb=S.balls.find(b=>b.active&&b.fury&&b.state==='fly');tx=Math.sin((1.7-S.furyT)*2.2)*3.6*(S.furySide||1);tz=1.12;if(fb){cam.x=lerp(cam.x,tx,.0);const p0=cam.zoom;cam.zoom=1;const pp=P(fb.x,fb.y,fb.z);cam.zoom=p0;fx=pp.x-cam.ox;fy=pp.y-cam.oy}}
  if(S.mode==='replay'&&S.rp){const k=S.rp.t/S.rp.dur;tx=S.rp.side*4.2*Math.sin(Math.min(1,k*1.4)*Math.PI*.5+Math.max(0,k-.7)*0);tz=1.28;const z0=cam.zoom;cam.zoom=1;const pp=P(S.rp.focus.x,1,S.rp.focus.z);cam.zoom=z0;fx=pp.x-cam.ox;fy=pp.y-cam.oy}
  const r=1-Math.exp(-dt*5);cam.x=lerp(cam.x,tx,r);cam.zoom=lerp(cam.zoom,tz,r);cam.fx=lerp(cam.fx,fx,r);cam.fy=lerp(cam.fy,fy,r);
  cam.shake=Math.max(0,cam.shake-dt*45);
  const fdt=dt*Math.max(ts,.25);
  for(const s of S.shouts)s.t+=dt;S.shouts=S.shouts.filter(s=>s.t<.95);
  for(const f of S.fx)f.t+=fdt;S.fx=S.fx.filter(f=>f.t<f.life);
  updThought(dt);
}

resize();
startRoundPreview();
function startRoundPreview(){S.chars=[];titleScreen()}
document.fonts&&document.fonts.ready.then(resize);
requestAnimationFrame(frame);
})();
</script>
