name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK
        run: cp app/build/outputs/apk/debug/app-debug.apk baleado-5x5.apk

      - name: Enviar o APK
        uses: actions/upload-artifact@v4
        with:
          name: baleado-5x5-apk
          path: baleado-5x5.apk
